    <section class="hero">
      <div class="inner">

        <h1>Createfully Yours</h1>
        <p>Stories of handmade celebrations, clever experiments, and the joyful details in between.</p>

    <section class="blog-shell">
      <div class="container blog-layout">
        <aside class="blog-sidebar">
          <h3>Posts</h3>
          <ul class="blog-list" id="post-list"></ul>

          <a href="https://www.instagram.com/saggiarchi/" class="icon fa-instagram" target="_blank" rel="noopener noreferrer"

      </ul>

    <script>
      const posts = [
        { title: "Why I Started: Createfully Yours", file: "blog-posts/why-this-blog.md" },
        { title: "Holi: A Celebration Close to My Heart", file: "blog-posts/holi-celebration.md" },
        { title: "Three Balloons, Four Cakes, One Teary-Eyed Maa", file: "blog-posts/dubu-dadi-birthday.md" }
      ];

      const postList = document.getElementById("post-list");
      const contentArea = document.getElementById("content-area");

      function setActive(index) {
        Array.from(postList.children).forEach((item, idx) => {
          item.classList.toggle("active", idx === index);
        });
      }

      function fetchMarkdown(path) {
        const xhrFallback = () =>
          new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", path, true);
            xhr.onreadystatechange = () => {
              if (xhr.readyState === 4) {
                if (xhr.status === 200 || xhr.status === 0) {
                  resolve(xhr.responseText);
                } else {
                  reject(new Error("XHR load error"));
                }
              }
            };
            xhr.onerror = reject;
            xhr.send();
          });

        if (window.fetch) {
          return fetch(path)
            .then((response) => {
              if (response.ok) return response.text();
              throw new Error("Network error");
            })
            .catch(() => xhrFallback());
        }

        return xhrFallback();
      }

      function renderMarkdown(markdown) {
        if (window.marked && typeof marked.parse === "function") {
          return marked.parse(markdown);
        }
        const escapeHTML = (str) =>
          str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        return '<pre class="fallback-markdown">' + escapeHTML(markdown) + "</pre>";
      }

      function loadPost(index) {
        const post = posts[index];
        if (!post) return;
        setActive(index);
        contentArea.innerHTML = "<p>Loading...</p>";
        fetchMarkdown(post.file)
          .then((markdown) => {
            contentArea.innerHTML = renderMarkdown(markdown);
            initCarousels();
          })
          .catch(() => {
            contentArea.innerHTML =
              "<p>Sorry, this post is taking longer than expected to load. Please try another entry.</p>";
          });
      }

      function initCarousels() {
        const carousels = contentArea.querySelectorAll(".image-carousel");
        carousels.forEach((carousel) => {
          const images = Array.from(carousel.querySelectorAll(".carousel-track img"));
          if (!images.length) return;
          let index = 0;
          const dots = document.createElement("div");
          dots.className = "carousel-dots";
          images.forEach((_, dotIndex) => {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.className = "carousel-dot";
            dot.setAttribute("aria-label", `Go to image ${dotIndex + 1}`);
            dot.addEventListener("click", () => {
              index = dotIndex;
              showImage(index);
            });
            dots.appendChild(dot);
          });
          const track = carousel.querySelector(".carousel-track");
          if (track) {
            track.insertAdjacentElement("afterend", dots);
          }
          const showImage = (newIndex) => {
            images.forEach((img, idx) => {
              img.classList.toggle("is-active", idx === newIndex);
            });
            const dotButtons = dots.querySelectorAll(".carousel-dot");
            dotButtons.forEach((dot, idx) => {
              dot.classList.toggle("is-active", idx === newIndex);
              dot.setAttribute("aria-current", idx === newIndex ? "true" : "false");
            });
          };
          showImage(index);
          const prevButton = carousel.querySelector(".carousel-control.prev");
          const nextButton = carousel.querySelector(".carousel-control.next");
          const step = (delta) => {
            index = (index + delta + images.length) % images.length;
            showImage(index);
          };
          if (prevButton) prevButton.addEventListener("click", () => step(-1));
          if (nextButton) nextButton.addEventListener("click", () => step(1));
          if (images.length < 2) {
            if (prevButton) prevButton.disabled = true;
            if (nextButton) nextButton.disabled = true;
          }
        });
      }

      function renderSidebar() {
        posts.forEach((post, index) => {
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = post.title;
          button.addEventListener("click", () => loadPost(index));
          li.appendChild(button);
          postList.appendChild(li);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderSidebar();
        loadPost(0);
      });
    </script>
  </body>
</html>
