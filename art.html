  <body class="landing">
    <header id="header" class="alt skel-layers-fixed">
      <nav id="nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="publications.html">Publications</a></li>
          <li><a href="blog.html">Createfully Yours</a></li>
          <li><a href="art.html">Art</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <div class="inner">
        <p class="eyebrow">Gallery</p>
        <h1>Art</h1>
        <p>Paintings and experiments in color, texture, and memory.</p>
      </div>
    </section>

    <section class="art-shell">
      <div class="container art-card">
        <div class="art-grid">
          <button
            class="art-tile"
            type="button"
            data-src="images/art/art-01.jpg"
            data-alt="Watercolor study"
            data-caption="A soft study in watercolor washes, layering light over light to find the final hue. These quiet pieces are my favorite way to reset between busy weeks."
          >
            <img src="images/art/art-01.jpg" alt="Watercolor study" />
          </button>
          <button
            class="art-tile"
            type="button"
            data-src="images/art/art-02.jpg"
            data-alt="Warm palette painting"
            data-caption="This one leans into warm pigments and loose edges, letting the brush do most of the talking. I love how the color movement feels almost musical."
          >
            <img src="images/art/art-02.jpg" alt="Warm palette painting" />
          </button>
          <button
            class="art-tile"
            type="button"
            data-src="images/art/art-03.jpg"
            data-alt="Night sky study"
            data-caption="A quick study of night skies and shimmering gradients, finished in one sitting. The goal was to keep it light, dreamy, and a little playful."
          >
            <img src="images/art/art-03.jpg" alt="Night sky study" />
          </button>
          <button
            class="art-tile"
            type="button"
            data-src="images/art/art-04.jpg"
            data-alt="Floral experiment"
            data-caption="An experiment with florals and negative space, keeping the shapes loose and airy. I kept the palette minimal to let the forms breathe."
          >
            <img src="images/art/art-04.jpg" alt="Floral experiment" />
          </button>
          <button
            class="art-tile"
            type="button"
            data-src="images/art/art-05.jpg"
            data-alt="Texture study"
            data-caption="A texture study with layered strokes and playful pigment blooms. It is an exercise in letting the paper absorb and surprise me."
          >
            <img src="images/art/art-05.jpg" alt="Texture study" />
          </button>
          <button
            class="art-tile"
            type="button"
            data-src="images/art/art-06.jpg"
            data-alt="Coastal palette"
            data-caption="A coastal-inspired palette with calm blues and sandy neutrals. I wanted it to feel like a deep breath and a slow exhale."
          >
            <img src="images/art/art-06.jpg" alt="Coastal palette" />
          </button>
        </div>
      </div>
    </section>

    <div class="art-modal" id="art-modal" aria-hidden="true">
      <div class="art-modal-content" role="dialog" aria-modal="true">
        <button class="art-modal-close" type="button" aria-label="Close">Close</button>
        <img id="art-modal-image" src="" alt="" />
        <p id="art-modal-caption"></p>
      </div>
    </div>

    <footer id="footer">
      <ul class="icons">
        <li>
          <a href="mailto:archita.agarwal19@gmail.com" class="icon fa-envelope" target="_blank" rel="noopener noreferrer"
            ><span class="label">Envelope</span></a
          >
        </li>
        <li>
          <a href="https://www.instagram.com/saggiarchi/" class="icon fa-instagram" target="_blank" rel="noopener noreferrer"
            ><span class="label">Instagram</span></a
          >
        </li>
      </ul>
    </footer>

    <script>
      const modal = document.getElementById("art-modal");
      const modalImage = document.getElementById("art-modal-image");
      const modalCaption = document.getElementById("art-modal-caption");
      const tiles = document.querySelectorAll(".art-tile");
      const closeButton = document.querySelector(".art-modal-close");

      function openModal(tile) {
        const src = tile.getAttribute("data-src");
        const alt = tile.getAttribute("data-alt") || "";
        const caption = tile.getAttribute("data-caption") || "";
        modalImage.src = src;
        modalImage.alt = alt;
        modalCaption.textContent = caption;
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        modalImage.src = "";
        modalImage.alt = "";
        modalCaption.textContent = "";
      }

      tiles.forEach((tile) => {
        tile.addEventListener("click", () => openModal(tile));
      });

      closeButton.addEventListener("click", closeModal);

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
